# infrastructure/cloudflare/wrangler.toml
# Cloudflare Worker and R2 CDN Bucket Configuration for Villa Platform

name = "villa-platform-cdn"
main = "src/index.ts"
compatibility_date = "2024-03-01"

# Bind Cloudflare R2 Media Bucket
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "villa-platform-media"
preview_bucket_name = "villa-platform-media-preview"

# Default Environment Variables
[vars]
CDN_BASE_URL = "https://cdn.mavon.online"
ENVIRONMENT = "production"

# Staging Environment Overrides
[env.staging]
name = "villa-platform-cdn-staging"
[env.staging.vars]
CDN_BASE_URL = "https://cdn.staging.mavon.online"
ENVIRONMENT = "staging"
